services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meeteora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meeteora}
      POSTGRES_DB: ${POSTGRES_DB:-meeteora}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-meeteora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-meeteora}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  scheduling:
    build:
      context: .
      dockerfile: apps/scheduling/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-meeteora}:${POSTGRES_PASSWORD:-meeteora}@db:5432/${POSTGRES_DB:-meeteora}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-meeteora}:${RABBITMQ_PASSWORD:-meeteora}@rabbitmq:5672
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-meeteora}:${POSTGRES_PASSWORD:-meeteora}@db:5432/${POSTGRES_DB:-meeteora}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-meeteora}:${RABBITMQ_PASSWORD:-meeteora}@rabbitmq:5672
      AUTH_PORT: 3003
      WEB_ORIGIN: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Owns no migrations; scheduling runs the shared ones on start.
      scheduling:
        condition: service_started

  notifications:
    build:
      context: .
      dockerfile: apps/notifications/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-meeteora}:${RABBITMQ_PASSWORD:-meeteora}@rabbitmq:5672
      NOTIFICATIONS_PORT: 3002
    depends_on:
      rabbitmq:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-meeteora}:${RABBITMQ_PASSWORD:-meeteora}@rabbitmq:5672
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:3000
    ports:
      - '3001:3001'
    depends_on:
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:3001
      AUTH_URL: http://auth:3003
      NOTIFICATIONS_URL: http://notifications:3002
    ports:
      - '3000:3000'
    depends_on:
      - api
      - auth
      - notifications

volumes:
  db-data:
  rabbitmq-data:
