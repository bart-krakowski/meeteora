apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: meeteora
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: meeteora
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: meeteora
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["api", "notifications", "scheduling", "web"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: meeteora
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: meeteora
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
