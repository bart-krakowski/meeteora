apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meeteora
  namespace: meeteora
spec:
  ingressClassName: nginx
  rules:
    - host: meeteora.local
      http:
        paths:
          # The browser only talks to web: tRPC, the auth proxy and the
          # notifications stream are all web routes calling the services in-cluster.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
